<style>
  :root{
    --bg:#F2F4F8;
    --card:#FFFFFF;
    --ink:#16181D;
    --muted:#6B7280;
    --ring-a:#F58529; /* warm orange */
    --ring-b:#DD2A7B; /* magenta */

    --ring-d:#515BD4; /* indigo */

Fg%3E%0A%3C%21--%20spark%20--%3E%0A%3Cg%20transform%3D%22translate%28180%2C282%29%22%3E%0A%3Cpath%20d%3D%22M12%200%20v8%20M12%2016%20v8%20M0%2012%20h8%20M16%2012%20h8%22%2F%3E%0A%3C%2Fg%3E%0A%3C%21--%20small%20tee%20--%3E%0A%3Cg%20transform%3D%22translate%28300%2C300%29%20rotate%2814%29%20scale%280.7%29%22%3E%0A%3Cpath%20d%3D%22M14%200%20L24%206%20L34%200%20L46%208%20L40%2018%20L34%2014%20L34%2044%20L14%2044%20L14%2014%20L8%2018%20L2%208%20Z%22%2F%3E%0A%3C%2Fg%3E%0A%3C%21--%20small%20mug%20--%3E%0A%3Cg%20transform%3D%22translate%288%2C120%29%20rotate%28-8%29%20scale%280.7%29%22%3E%0A%3Crect%20x%3D%220%22%20y%3D%220%22%20width%3D%2230%22%20height%3D%2236%22%20rx%3D%224%22%2F%3E%0A%3Cpath%20d%3D%22M30%208%20h8%20a7%207%200%200%201%200%2016%20h-8%22%2F%3E%0A%3C%2Fg%3E%0A%3C%2Fg%3E%0A%3C%2Fsvg%3E") repeat;
    background-size:340px 340px;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 20px 64px;
  }
  .card-col{width:100%;max-width:420px}

  /* ---- header ---- */
  .logo-wrap{
    margin:0 auto 18px;
    max-width:280px;
    animation:ring-in .9s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes ring-in{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .logo-wrap img{
    width:100%;height:auto;display:block;
    filter:drop-shadow(0 3px 10px rgba(22,24,29,.12));
  }
  h1{
    font-family:'Sora',sans-serif;font-weight:700;font-size:26px;
    text-align:center;letter-spacing:-0.02em;
  }
  .tagline{
    text-align:center;color:var(--muted);font-size:15px;line-height:1.5;
    margin-top:2px;margin-bottom:30px;
  }
  .tagline b{color:var(--ink)}

  /* ---- links ---- */
  .links{display:flex;flex-direction:column;gap:14px}
  .link{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border-radius:16px;
    padding:16px 18px;
    text-decoration:none;color:var(--ink);
    font-weight:600;font-size:16px;
    box-shadow:0 1px 2px rgba(22,24,29,.06),0 4px 14px rgba(22,24,29,.05);
    border-left:5px solid var(--accent);
    transition:transform .15s ease, box-shadow .15s ease;
    animation:rise .5s ease both;
  }
  .link:nth-child(1){animation-delay:.05s}
  .link:nth-child(2){animation-delay:.12s}
  .link:nth-child(3){animation-delay:.19s}
  .link:nth-child(4){animation-delay:.26s}
  .link:nth-child(5){animation-delay:.33s}
  .link:nth-child(6){animation-delay:.40s}
  .link:nth-child(7){animation-delay:.47s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .link:hover,.link:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 2px 4px rgba(22,24,29,.08),0 10px 24px rgba(22,24,29,.10);
  }
  .link:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .link svg{width:26px;height:26px;flex-shrink:0;fill:var(--accent)}
  .link .go{margin-left:auto;color:var(--muted);font-weight:400;font-size:18px}

  .fb{--accent:#1877F2}
  .ig{--accent:#DD2A7B}
  .tt{--accent:#16181D}
  .wa{--accent:#25D366}
  .em{--accent:#8134AF}
  .yt{--accent:#FF0000}
  .am{--accent:#FF9900}

  footer{
    text-align:center;margin-top:36px;color:var(--muted);font-size:13px;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap,.link{animation:none}
    .link{transition:none}
  }
</style>
</head>
